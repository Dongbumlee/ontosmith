name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pub
      - name: Sync site/ onto the gh-pages branch
        run: |
          rsync -a --delete --exclude .git src/site/ pub/
          touch pub/.nojekyll
      - name: Commit and push if the site changed
        working-directory: pub
        run: |
          git config user.name "Dongbumlee"
          git config user.email "22075636+Dongbumlee@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Site unchanged; nothing to publish."
          else
            git commit -m "Publish site from ${GITHUB_SHA::7}"
            git push origin gh-pages
          fi
