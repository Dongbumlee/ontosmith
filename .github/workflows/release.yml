name: Release

# Publish to PyPI via Trusted Publishing (OIDC — no stored
# credentials). Fires on a version tag push; can also be
# dispatched manually against an existing tag (the v0.1.0
# path once the pending publisher is registered on PyPI).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Trusted Publishing token exchange
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches the package version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          PKG=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG package=$PKG"
          test "v$PKG" = "$TAG"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build with the PyPI README variant
        run: |
          python scripts/build_pypi_readme.py
          cp build/pypi/README.md README.md
          python -m build

      - name: Check the distributions
        run: twine check dist/*

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
